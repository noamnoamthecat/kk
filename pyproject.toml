[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regimeml"
version = "0.1.0"
description = "Regime-aware, conformally-calibrated ML for cross-sectional equity signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "scikit-learn>=1.4",
  "matplotlib>=3.8", "requests>=2.31",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=8"]

[project.scripts]
regimeml-research = "regimeml.pipeline:main"
regimeml-live = "regimeml.live:main"

[tool.setuptools]
packages = ["regimeml"]
